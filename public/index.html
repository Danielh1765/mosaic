<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mosaic</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='12' height='16' rx='3' fill='%231E1E1E'/><rect x='18' y='2' width='12' height='10' rx='3' fill='%23E5A9B2'/><rect x='2' y='22' width='12' height='8' rx='3' fill='%23E5A9B2'/><rect x='18' y='16' width='12' height='14' rx='3' fill='%231E1E1E'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400&family=Roboto+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        Mosaic
      </a>
      <label class="search">
        <input id="search" type="search" placeholder="Search pages" autocomplete="off">
        <kbd>⌘K</kbd>
      </label>
      <nav class="tree" id="tree" aria-label="Pages"></nav>
      <a class="trash-link" id="trash-link" href="#/trash"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11M6.5 4V2.5h3V4M4 4l.7 9.2c.1.7.6 1.3 1.3 1.3h4c.7 0 1.2-.6 1.3-1.3L12 4"/></svg><span>Trash</span><span class="trash-count" id="trash-count"></span></a>
      <button class="new-root" id="new-root" type="button">+ New page</button>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="cover-input" accept="image/*" hidden>
  <script type="module" src="/app.js"></script>
</body>
</html>
